<!DOCTYPE HTML>
<html lang="en">
<head>
    <link rel="stylesheet" href="../static/styling.css" th:href="@{/styling.css}">
    <title>View Analytics</title>
</head>
<body>
<div class="header">
    <h1 class="header-text">View Analytics</h1>
    <div class="header-images">
        <form th:action="@{/dashboard_consumer}"><input class="header-icons" type="image" th:src="@{images/home.png}" src="/static/images/home.png" alt="Home"></form>
        <form th:action="@{/notifications_consumer}"><input class="header-icons" type="image" th:src="@{images/bell.png}" src="/static/images/bell.png" alt="Bell"></form>
        <form th:action="@{/logout}" method="post"><input class="header-icons" type="image" th:src="@{images/logout.png}" src="/static/images/logout.png" alt="logout"></form>
        <img th:src="@{images/roadmap_logo.png}" src="/static/images/roadmap_logo.png" alt="Team Roadmap Logo" class="header-logo">
    </div>
</div>
<div class="box1" style="width: 90vw">
    <label for="anTable">Analytics Table:</label>
    <div class="analytics-table" id="anTable" style="padding: 1%">
        <div>My Streak</div>
        <div>Bundles Collected</div>
        <div>CO2e Saved</div>
        <div>Badges Collected</div>
        <div style="font-size: 6vmax; background-color: #4a6fa5" th:text="${streak}">-1</div>
        <div style="font-size: 6vmax; background-color: #4a6fa5" th:text="${collected}">-1</div>
        <div style="font-size: 6vmax; background-color: #4a6fa5" th:text="${co2_save}">-1</div>
        <div style="font-size: 6vmax; background-color: #4a6fa5" th:text="${no_badges}">-1</div>
    </div>
</div>

<div class="box1" style="width: 90vw">
        <label for="badgeTable">Badge Table:</label>
        <div class="badges-table" id="badgeTable">
                <div>Meals Saved</div>
                <div>Categories Bought</div>
                <div>Sellers Bought From</div>
                <div>CO2e Saved</div>
                    <div th:if="${badges[0]}">
                        <svg  width="100" height="100">
                            <circle cx="50" cy="50" r="40" fill="green"/>
                            <text fill="#ffffff" font-size="50" x="35" y="65">1</text>
                        </svg>
                    </div>
                    <div th:unless="${badges[0]}">
                        <svg  width="100" height="100">
                            <circle cx="50" cy="50" r="40" fill="red"/>
                            <text fill="#ffffff" font-size="50" x="35" y="65">1</text>
                        </svg>
                    </div>
                <div th:if="${badges[3]}">
                    <svg  width="100" height="100">
                        <rect x="10" y="8" width="80" height="80" fill="green"></rect>
                        <text fill="#ffffff" font-size="50" x="35" y="65">1</text>
                    </svg>
                </div>
                <div th:unless="${badges[3]}">
                    <svg  width="100" height="100">
                        <rect x="10" y="8" width="80" height="80" fill="red"></rect>
                        <text fill="#ffffff" font-size="50" x="35" y="65">1</text>
                    </svg>
                </div>
                <div th:if="${badges[6]}">
                    <svg width="100" height="100">
                        <polygon points="0 90, 100 90, 50 0" style="fill:green"/>
                        <text fill="#ffffff" font-size="50" x="35" y="65">1</text>
                    </svg>
                </div>
                <div th:unless="${badges[6]}">

                    </svg>
                </div>
                <div th:if="${badges[9]}">

                        <polygon points="50 5, 95 27.5, 95 72.5, 50 95, 5 72.5, 5 27.5" style="fill:green"/>
